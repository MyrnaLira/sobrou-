<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- TÍTULO DA PÁGINA E COMPARTILHAMENTO -->
    <title>Sobrou!</title>
    <meta property="og:title" content="Sobrou!">
    <meta property="og:description" content="Controle financeiro simples e prático.">
    <meta property="og:type" content="website">

    <style>
        :root {
            --pink: #ff007f;
            --pink-hover: #e0006f;
            --pink-light: rgba(255, 0, 127, 0.15);
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --border-color: #333333;
            --text-color: #f5f5f5;
            --text-muted: #aaaaaa;
            --green: #2ecc71;
            --red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            padding: 12px 10px 40px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            padding: 20px 16px;
            border: 1px solid var(--border-color);
        }

        .hidden {
            display: none !important;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-box {
            display: inline-block;
            background: var(--dark-bg);
            padding: 12px 20px;
            border-radius: 8px;
            color: var(--pink);
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 2px;
            border: 1px solid var(--pink);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .title-divider {
            border-top: 1px solid var(--pink);
            border-bottom: 1px solid var(--pink);
            padding: 6px 0;
            margin: 15px 0 20px 0;
            text-align: center;
        }

        .title-divider h2 {
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
        }

        /* NAVEGAÇÃO ENTRE LOGIN E CADASTRO */
        .auth-tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .auth-tab.active {
            color: var(--pink);
            border-bottom: 2px solid var(--pink);
        }

        .section-header {
            background: #000000;
            color: var(--pink);
            padding: 10px 12px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid var(--pink);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .radio-card {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 10px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .radio-card:has(input:checked) {
            border-color: var(--pink);
            background: var(--pink-light);
        }

        .radio-card input[type="radio"] {
            margin-right: 8px;
            accent-color: var(--pink);
            transform: scale(1.2);
        }

        .radio-card label {
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px; 
            color: #ffffff;
            outline: none;
            appearance: none;
        }

        .form-control:focus {
            border-color: var(--pink);
            box-shadow: 0 0 5px rgba(255, 0, 127, 0.4);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-row .full-width {
            grid-column: span 2;
        }

        .btn-submit {
            width: 100%;
            background: var(--pink);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(255, 0, 127, 0.3);
            touch-action: manipulation;
        }

        .btn-submit:active {
            background: var(--pink-hover);
            transform: scale(0.98);
        }

        .btn-logout {
            background: transparent;
            color: var(--pink);
            border: 1px solid var(--pink);
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .msg-box {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        .error-msg { color: var(--red); }
        .success-msg { color: var(--green); }

        /* Encartes de Resumo Financeiro */
        .summary-cards {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .card-stat {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 4px;
        }

        .card-stat h4 {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .card-stat p {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .stat-entrada { color: var(--green); }
        .stat-saida { color: var(--red); }
        .stat-saldo { color: #ffffff; }

        /* Tabela Otimizada */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.8rem;
        }

        th {
            background: #000000;
            color: var(--pink);
            text-align: left;
            padding: 10px 8px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .tipo-badge {
            font-weight: bold;
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 4px;
            display: inline-block;
        }
        .badge-entrada { background: rgba(46, 204, 113, 0.2); color: var(--green); }
        .badge-saida { background: rgba(231, 76, 60, 0.2); color: var(--red); }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--red);
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .btn-delete:hover {
            background: rgba(231, 76, 60, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <div class="logo-box">SOBROU!</div>
    </div>

    <!-- TELA DE AUTENTICAÇÃO -->
    <div id="auth-screen">
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-login">Entrar</button>
            <button type="button" class="auth-tab" id="tab-register">Cadastrar</button>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="usuario-login">Usuário:</label>
                <input type="text" id="usuario-login" class="form-control" placeholder="Seu usuário" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="senha-login">Senha:</label>
                <input type="password" id="senha-login" class="form-control" placeholder="Sua senha" required autocomplete="current-password">
            </div>
            <p id="login-error" class="msg-box error-msg">Usuário ou senha incorretos!</p>
            <button type="submit" class="btn-submit">Acessar</button>
        </form>

        <form id="register-form" class="hidden">
            <div class="form-group">
                <label for="usuario-reg">Crie um Usuário:</label>
                <input type="text" id="usuario-reg" class="form-control" placeholder="Ex: maria123" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="senha-reg">Crie uma Senha:</label>
                <input type="password" id="senha-reg" class="form-control" placeholder="Mínimo 4 caracteres" required autocomplete="new-password">
            </div>
            <p id="register-msg" class="msg-box"></p>
            <button type="submit" class="btn-submit">Criar Conta</button>
        </form>
    </div>

    <!-- TELA DO APLICATIVO -->
    <div id="app-screen" class="hidden">
        <div class="title-divider">
            <h2>Entradas e Saídas</h2>
        </div>

        <div class="section-header">
            <span>TRANSAÇÕES</span>
            <button type="button" class="btn-logout" id="btn-logout" onclick="fazerLogout()">Sair</button>
        </div>

        <form id="finance-form">
            <div class="radio-group">
                <label class="radio-card">
                    <input type="radio" id="entrada" name="tipo" value="Entrada" checked>
                    <span>Entrada</span>
                </label>
                <label class="radio-card">
                    <input type="radio" id="saida" name="tipo" value="Saída">
                    <span>Saída</span>
                </label>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição / Histórico:</label>
                <input type="text" id="descricao" class="form-control" placeholder="Ex: Pagamento, Material...">
            </div>

            <div class="form-group">
                <label for="categoria">Categoria / Cliente:</label>
                <input type="text" id="categoria" class="form-control" placeholder="Ex: Cliente X, Fornecedor Y...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="data">Data:</label>
                    <input type="date" id="data" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="forma">Pagamento:</label>
                    <select id="forma" class="form-control">
                        <option value="Pix">Pix</option>
                        <option value="Cartão">Cartão</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Boleto">Boleto</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="valor">Valor (R$):</label>
                    <input type="text" id="valor" class="form-control" inputmode="decimal" placeholder="0,00" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Registrar</button>
        </form>

        <div class="summary-cards">
            <div class="card-stat">
                <h4>Entradas</h4>
                <p class="stat-entrada" id="total-entradas">R$ 0,00</p>
            </div>
            <div class="card-stat">
                <h4>Saídas</h4>
                <p class="stat-saida" id="total-saidas">R$ 0,00</p>
            </div>
            <div class="card-stat">
                <h4>Saldo</h4>
                <p class="stat-saldo" id="total-saldo">R$ 0,00</p>
            </div>
        </div>

        <div class="section-header">HISTÓRICO RECENTE</div>
        <div class="table-responsive">
            <table id="tabela-registros">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th style="width: 30px;"></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lançamentos entram aqui via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Elementos da Interface
    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const loginError = document.getElementById('login-error');
    const registerMsg = document.getElementById('register-msg');

    // Alternar Abas
    tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
    });

    tabRegister.addEventListener('click', () => {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
    });

    function getUsers() {
        return JSON.parse(localStorage.getItem('app_users') || '{}');
    }

    registerForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('usuario-reg').value.trim().toLowerCase();
        const pass = document.getElementById('senha-reg').value.trim();

        if (pass.length < 4) {
            registerMsg.innerText = "A senha deve ter no mínimo 4 caracteres.";
            registerMsg.className = "msg-box error-msg";
            registerMsg.style.display = "block";
            return;
        }

        const users = getUsers();
        if (users[user]) {
            registerMsg.innerText = "Este usuário já existe! Escolha outro.";
            registerMsg.className = "msg-box error-msg";
            registerMsg.style.display = "block";
        } else {
            users[user] = pass;
            localStorage.setItem('app_users', JSON.stringify(users));
            localStorage.setItem('user_logged_in', user);
            registerForm.reset();
            showApp();
        }
    });

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('usuario-login').value.trim().toLowerCase();
        const pass = document.getElementById('senha-login').value.trim();
        const users = getUsers();

        if (users[user] && users[user] === pass) {
            localStorage.setItem('user_logged_in', user);
            loginError.style.display = 'none';
            showApp();
        } else {
            loginError.style.display = 'block';
        }
    });

    window.fazerLogout = function() {
        localStorage.removeItem('user_logged_in');
        appScreen.classList.add('hidden');
        authScreen.classList.remove('hidden');
        document.getElementById('usuario-login').value = '';
        document.getElementById('senha-login').value = '';
    };

    if (localStorage.getItem('user_logged_in')) {
        showApp();
    }

    function showApp() {
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        document.getElementById('data').valueAsDate = new Date();
        carregarTransacoes();
    }

    const form = document.getElementById('finance-form');
    const tabela = document.getElementById('tabela-registros').querySelector('tbody');
    let transacoes = [];

    function getStorageKey() {
        const currentUser = localStorage.getItem('user_logged_in') || 'visitante';
        return `transacoes_${currentUser}`;
    }

    function salvarTransacoes() {
        localStorage.setItem(getStorageKey(), JSON.stringify(transacoes));
    }

    function carregarTransacoes() {
        const dadosSalvos = localStorage.getItem(getStorageKey());
        transacoes = dadosSalvos ? JSON.parse(dadosSalvos) : [];
        renderizarInterface();
    }

    function renderizarInterface() {
        tabela.innerHTML = '';
        let totalEntradas = 0;
        let totalSaidas = 0;

        transacoes.forEach((item, index) => {
            const valorNumerico = parseFloat(item.valor) || 0;

            if (item.tipo === 'Entrada') {
                totalEntradas += valorNumerico;
            } else {
                totalSaidas += valorNumerico;
            }

            const partesData = item.data.split('-');
            const dataFormatada = partesData.length === 3 ? `${partesData[2]}/${partesData[1]}/${partesData[0].substring(2)}` : item.data;
            const badgeClass = item.tipo === 'Entrada' ? 'badge-entrada' : 'badge-saida';

            const novaLinha = document.createElement('tr');
            novaLinha.innerHTML = `
                <td>${dataFormatada}</td>
                <td>${item.descricao}<br><small style="color: var(--text-muted); font-size: 0.7rem;">${item.categoria ? item.categoria + ' • ' : ''}${item.forma}</small></td>
                <td><span class="tipo-badge ${badgeClass}">${item.tipo}</span></td>
                <td style="font-weight: bold;">R$ ${valorNumerico.toFixed(2).replace('.', ',')}</td>
                <td><button type="button" class="btn-delete" title="Excluir" onclick="deletarTransacao(${index})">✕</button></td>
            `;
            tabela.prepend(novaLinha);
        });

        const saldo = totalEntradas - totalSaidas;
        document.getElementById('total-entradas').innerText = `R$ ${totalEntradas.toFixed(2).replace('.', ',')}`;
        document.getElementById('total-saidas').innerText = `R$ ${totalSaidas.toFixed(2).replace('.', ',')}`;
        document.getElementById('total-saldo').innerText = `R$ ${saldo.toFixed(2).replace('.', ',')}`;
    }

    window.deletarTransacao = function(index) {
        transacoes.splice(index, 1);
        salvarTransacoes();
        renderizarInterface();
    };

    // SUBMISSÃO DO FORMULÁRIO FINANCEIRO
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const rawValor = document.getElementById('valor').value.trim();
        
        // Tratamento para ler tanto 1000 quanto 1000.00 ou 1000,00
        let valorLimpo = rawValor.replace(/\./g, '').replace(',', '.');
        let valorTratado = parseFloat(valorLimpo);

        if (isNaN(valorTratado) || valorTratado <= 0) {
            alert('Por favor, digite um valor numérico válido.');
            return;
        }

        const descricaoInput = document.getElementById('descricao').value.trim();
        const categoriaInput = document.getElementById('categoria').value.trim();
        const dataInput = document.getElementById('data').value;
        const formaInput = document.getElementById('forma').value;
        const tipoInput = document.querySelector('input[name="tipo"]:checked').value;

        const novaTransacao = {
            id: Date.now(),
            tipo: tipoInput,
            descricao: descricaoInput !== '' ? descricaoInput : 'Sem descrição',
            categoria: categoriaInput,
            data: dataInput,
            forma: formaInput,
            valor: valorTratado
        };

        transacoes.push(novaTransacao);
        salvarTransacoes();
        renderizarInterface();

        // Limpeza do formulário
        form.reset();
        document.getElementById('data').valueAsDate = new Date();
    });
</script>

</body>
</html>
